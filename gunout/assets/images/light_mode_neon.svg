<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap');
      .title { font-family: 'Orbitron', monospace; font-weight: 700; }
    </style>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF0F7"/>
      <stop offset="100%" stop-color="#FFE0EF"/>
    </linearGradient>
    <linearGradient id="la" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF2D95" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2D95" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="200" fill="url(#lg)" rx="16"/>
  <g stroke="url(#la)" stroke-width="1.5" fill="none" filter="url(#glow)">
    <path d="M0 50 H800"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></path>
    <path d="M0 100 H800"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></path>
    <path d="M0 150 H800"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/></path>
  </g>
  
  <text x="400" y="115" text-anchor="middle" class="title" font-size="36" fill="#FF2D95" letter-spacing="8" filter="url(#glow)">
    gunout
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
