<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4F8FF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3F3"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF"/>
      <stop offset="50%"  stop-color="#00122E"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#0055FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="996" height="356" rx="16" fill="none" stroke="url(#txt)" stroke-width="2" filter="url(#glow)"/>

  <g stroke="#E30613" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M28 50 h30 M28 50 v30"/>
    <path d="M972 50 h-30 M972 50 v30"/>
    <path d="M28 310 h30 M28 310 v-30"/>
    <path d="M972 310 h-30 M972 310 v-30"/>
  </g>

  <text x="500" y="110" text-anchor="middle" font-family="Orbitron, monospace" font-size="44" font-weight="700" fill="url(#txt)" filter="url(#glow)">GUNOUT</text>
  <text x="500" y="145" text-anchor="middle" font-family="Orbitron, monospace" font-size="14" letter-spacing="6" fill="#00122E" opacity="0.85">◆ LIGHT MODE ◆</text>

  <!-- ================= PANNEAU 1 : WHOAMI ================= -->
  <g transform="translate(120,190)">
    <rect x="0" y="0" width="360" height="120" rx="12" fill="#FFFFFF" stroke="#0055FF" stroke-width="2" filter="url(#glow)"/>

    <text x="20" y="34" font-family="monospace" font-size="14" fill="#0055FF">&gt; whoami</text>
    <text x="20" y="58" font-family="monospace" font-size="13" fill="#00122E">Python · Automation</text>
    <text x="20" y="80" font-family="monospace" font-size="13" fill="#00122E">Web · Data · Veille</text>
    <text x="20" y="102" font-family="monospace" font-size="13" fill="#E30613">▸ status: ONLINE<tspan fill="#0055FF">_<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite" /></tspan></text>
  </g>

  <!-- ================= PANNEAU 2 : STATS ================= -->
  <g transform="translate(520,190)">
    <rect x="0" y="0" width="360" height="120" rx="12" fill="#FFFFFF" stroke="#E30613" stroke-width="2" filter="url(#glow)"/>

    <text x="20" y="34" font-family="monospace" font-size="14" fill="#E30613">&gt; stats</text>
    <text x="20" y="58" font-family="monospace" font-size="13" fill="#00122E">47 repos / October 2026</text>
    <text x="20" y="80" font-family="monospace" font-size="13" fill="#00122E">Rapid shipping mode</text>
    <text x="20" y="102" font-family="monospace" font-size="13" fill="#0055FF">▸ status: ONLINE<tspan fill="#E30613">_<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite" /></tspan></text>
  </g>

  <!-- PIED DE PAGE -->
  <text x="500" y="335" text-anchor="middle" font-family="Orbitron, monospace" font-size="11" letter-spacing="4" fill="#00122E" opacity="0.6">
    ◆ PYTHON · AUTOMATION · WEB · DATA ◆
  </text>
</svg>
