<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="50%" stop-color="#0D001A"/>
      <stop offset="100%" stop-color="#1A0008"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="220" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="216" rx="16" fill="none" stroke="url(#txt)" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="105" text-anchor="middle" font-family="Orbitron, monospace" font-size="52" font-weight="700" fill="url(#txt)" filter="url(#glow)">GUNOUT</text>
  <text x="500" y="155" text-anchor="middle" font-family="Orbitron, monospace" font-size="18" fill="#FFFFFF" opacity="0.85">◆ NEON PROTOCOL ONLINE ◆</text>
</svg>
