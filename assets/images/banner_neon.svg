<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap');
      .title { font-family: 'Orbitron', 'Share Tech Mono', monospace; font-weight: 700; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0D001A"/>
      <stop offset="50%"  stop-color="#1A0026"/>
      <stop offset="100%" stop-color="#0D001A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF2D95"/>
      <stop offset="50%"  stop-color="#FFB6D9"/>
      <stop offset="100%" stop-color="#FF2D95"/>
      <animate attributeName="x1" values="-1;1;-1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  
  <rect width="1600" height="400" fill="url(#bg)"/>
  
  <!-- Grille animée qui défile -->
  <g stroke="#FF2D95" stroke-opacity="0.15" stroke-width="1">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400 M1200 0 V400 M1400 0 V400">
      <animateTransform attributeName="transform" type="translate" values="0,0; 100,0; 0,0" dur="10s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Cercles pulsants -->
  <circle cx="300"  cy="120" r="140" fill="#FF2D95" fill-opacity="0.12">
    <animate attributeName="r" values="140;160;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.12;0.05;0.12" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1300" cy="300" r="180" fill="#FF69B4" fill-opacity="0.10">
    <animate attributeName="r" values="180;200;180" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Texte "gunout" avec effet de respiration -->
  <text x="800" y="200" text-anchor="middle" class="title" font-size="110" fill="url(#accent)" filter="url(#glow)" letter-spacing="4">
    gunout
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Sous-titre -->
  <text x="800" y="270" text-anchor="middle" font-family="monospace" font-size="24" fill="#FFB6D9" letter-spacing="10">DATA · AUTOMATION · VEILLE</text>
  
  <!-- Ligne de scan qui traverse -->
  <line x1="600" y1="300" x2="1000" y2="300" stroke="url(#accent)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="x1" values="600;1000;600" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="800;1200;800" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="600" cy="300" r="4" fill="#FFB6D9"/>
  <circle cx="1000" cy="300" r="4" fill="#FFB6D9"/>
</svg>
