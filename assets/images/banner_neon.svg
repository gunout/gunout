<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#000814"/>
      <stop offset="50%"  stop-color="#00122E"/>
      <stop offset="100%" stop-color="#1A0008"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0055FF" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="220" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="996" height="216" rx="16" fill="none" stroke="url(#txt)" stroke-width="2" filter="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M30 40 h30 M30 40 v30"/>
    <path d="M970 40 h-30 M970 40 v30"/>
    <path d="M30 180 h30 M30 180 v-30"/>
    <path d="M970 180 h-30 M970 180 v-30"/>
  </g>
  <text x="500" y="105" text-anchor="middle" font-family="Orbitron, monospace" font-size="56" font-weight="700" fill="url(#txt)" filter="url(#glow)">GUNOUT</text>
  <text x="500" y="152" text-anchor="middle" font-family="Orbitron, monospace" font-size="16" letter-spacing="4" fill="#FFFFFF" opacity="0.9">◆ NEON PROTOCOL ONLINE ◆</text>
  <text x="500" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#0055FF" opacity="0.8">[ SYSTEM READY ]</text>
</svg>
