<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" preserveAspectRatio="none">
  <defs>
    <!-- Dégradé de la ligne de base (bleu -> blanc -> rouge) -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#0055FF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="80%"  stop-color="#E30613"/>
      <stop offset="100%" stop-color="#E30613" stop-opacity="0"/>
    </linearGradient>

    <!-- Dégradé du faisceau de scan (blanc au centre, transparent aux bords) -->
    <linearGradient id="scan-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtre glow pour la ligne et le faisceau -->
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- On limite le scan à la zone de la ligne (0 à 900) -->
    <clipPath id="line-clip">
      <rect x="0" y="0" width="900" height="16"/>
    </clipPath>
  </defs>

  <!-- Fond blanc (pour éviter le fond noir en dark mode GitHub) -->
  <rect width="900" height="16" fill="#FFFFFF"/>

  <!-- Ligne de base (statique, avec glow) -->
  <line x1="0" y1="8" x2="900" y2="8" stroke="url(#g)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Faisceau de scan animé de gauche à droite -->
  <g clip-path="url(#line-clip)">
    <rect x="-150" y="2" width="150" height="12" fill="url(#scan-beam)" filter="url(#glow)" opacity="0.9">
      <!-- Animation : déplacement de x = -150 (hors écran gauche) à x = 900 (hors écran droit) -->
      <animate attributeName="x" 
               values="-150; 900" 
               dur="4s" 
               repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Point central lumineux (clignotant) -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <rect x="445" y="4" width="10" height="8" rx="2">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="430" y="6" width="6" height="4" rx="1" opacity="0.7"/>
    <rect x="464" y="6" width="6" height="4" rx="1" opacity="0.7"/>
  </g>
</svg>
