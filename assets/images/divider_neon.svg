<svg xmlns="http://www.w3.org/2000/svg" width="800" height="6" viewBox="0 0 800 6">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF2D95" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#FFB6D9" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#FF69B4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2D95" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond blanc pour éviter le fond noir en dark mode GitHub -->
  <rect width="800" height="6" fill="#FFFFFF"/>

  <!-- Ligne rose animée -->
  <rect width="800" height="6" rx="3" fill="url(#g)" filter="url(#glow)"/>
</svg>
