<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <style>
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes fadeInOut {
        0%   { opacity:0 }
        10%  { opacity:1 }
        85%  { opacity:1 }
        95%  { opacity:0 }
        100% { opacity:0 }
      }
      @keyframes pulse { 0%,100% { opacity:0.6 } 50% { opacity:1 } }
      @keyframes grow { 0%,5% { width:0 } 44%,85% { width:560px } 95%,100% { width:0 } }
      @keyframes cornerBlink { 0%,100% { opacity:0.4 } 50% { opacity:1 } }

      .blink    { animation: blink 1s infinite; }
      .fade1    { animation: fadeInOut 10s infinite; }
      .fade2    { animation: fadeInOut 10s infinite; animation-delay: 0.5s; }
      .fade3    { animation: fadeInOut 10s infinite; animation-delay: 1.0s; }
      .fade4    { animation: fadeInOut 10s infinite; animation-delay: 1.5s; }
      .fade5    { animation: fadeInOut 10s infinite; animation-delay: 2.0s; }
      .fade6    { animation: fadeInOut 10s infinite; animation-delay: 2.5s; }
      .fade7    { animation: fadeInOut 10s infinite; animation-delay: 3.0s; }
      .fade8    { animation: fadeInOut 10s infinite; animation-delay: 3.5s; }
      .pulse    { animation: pulse 3s infinite; }
      .corner   { animation: cornerBlink 3s infinite; }
      .corner2  { animation: cornerBlink 3s infinite; animation-delay: 0.5s; }
      .corner3  { animation: cornerBlink 3s infinite; animation-delay: 1s; }
      .corner4  { animation: cornerBlink 3s infinite; animation-delay: 1.5s; }
      .bar      { animation: grow 10s infinite; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4F8FF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3F3"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF"/>
      <stop offset="50%"  stop-color="#00122E"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#0055FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="18" fill="url(#grid)"/>

  <rect x="2" y="2" width="996" height="356" rx="16" fill="none"
        stroke="url(#txt)" stroke-width="2" class="pulse"/>

  <g stroke="#E30613" stroke-width="3" fill="none">
    <path class="corner"  d="M28 50 h30 M28 50 v30"/>
    <path class="corner2" d="M972 50 h-30 M972 50 v30"/>
    <path class="corner3" d="M28 310 h30 M28 310 v-30"/>
    <path class="corner4" d="M972 310 h-30 M972 310 v-30"/>
  </g>

  <text x="500" y="110" text-anchor="middle" font-family="Orbitron, monospace"
        font-size="44" font-weight="700" fill="url(#txt)" class="pulse">GUNOUT</text>
  <text x="500" y="145" text-anchor="middle" font-family="Orbitron, monospace"
        font-size="14" letter-spacing="6" fill="#00122E" class="pulse">&#9670; LIGHT MODE &#9670;</text>

  <!-- Panneau gauche -->
  <g transform="translate(120,190)">
    <rect x="0" y="0" width="360" height="120" rx="12" fill="#FFFFFF"
          stroke="#0055FF" stroke-width="2" class="pulse"/>
    <text x="20" y="34"  font-family="monospace" font-size="14" fill="#0055FF" class="fade1">&gt; whoami</text>
    <text x="20" y="58"  font-family="monospace" font-size="13" fill="#00122E" class="fade2">Python &#183; Automation</text>
    <text x="20" y="80"  font-family="monospace" font-size="13" fill="#00122E" class="fade3">Web &#183; Data &#183; Veille</text>
    <text x="20" y="102" font-family="monospace" font-size="13" fill="#E30613" class="fade4">&#9656; status: ONLINE</text>
    <text x="168" y="102" font-family="monospace" font-size="13" fill="#0055FF" class="blink">_</text>
  </g>

  <!-- Panneau droit -->
  <g transform="translate(520,190)">
    <rect x="0" y="0" width="360" height="120" rx="12" fill="#FFFFFF"
          stroke="#E30613" stroke-width="2" class="pulse"/>
    <text x="20" y="34"  font-family="monospace" font-size="14" fill="#E30613" class="fade5">&gt; stats</text>
    <text x="20" y="58"  font-family="monospace" font-size="13" fill="#00122E" class="fade6">47 repos / October 2026</text>
    <text x="20" y="80"  font-family="monospace" font-size="13" fill="#00122E" class="fade7">Rapid shipping mode</text>
    <text x="20" y="102" font-family="monospace" font-size="13" fill="#0055FF" class="fade8">&#9656; light speed</text>
    <text x="150" y="102" font-family="monospace" font-size="13" fill="#E30613" class="blink">_</text>
  </g>

  <!-- Barre -->
  <g transform="translate(120,330)">
    <rect x="0" y="0" width="760" height="8" rx="4" fill="#DCE6F5"/>
    <rect x="0" y="0" width="560" height="8" rx="4" fill="#0055FF" class="bar"/>
    <rect x="560" y="0" width="100" height="8" rx="4" fill="#00122E" opacity="0.9"/>
    <rect x="660" y="0" width="100" height="8" rx="4" fill="#E30613"/>
  </g>

  <!-- Indicateurs -->
  <g transform="translate(900,340)">
    <circle cx="0"  cy="0" r="3" fill="#0055FF" class="corner"/>
    <circle cx="14" cy="0" r="3" fill="#00122E" class="corner2"/>
    <circle cx="28" cy="0" r="3" fill="#E30613" class="corner3"/>
  </g>
</svg>
