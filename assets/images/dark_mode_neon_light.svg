<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4F8FF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3F3"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF"/>
      <stop offset="50%"  stop-color="#00122E"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#0055FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond + grille -->
  <rect width="1000" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="18" fill="url(#grid)"/>

  <!-- Cadre néon -->
  <rect x="2" y="2" width="996" height="356" rx="16" fill="none"
        stroke="url(#txt)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Coins décoratifs -->
  <g stroke="#E30613" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M28 50 h30 M28 50 v30">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M972 50 h-30 M972 50 v30">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M28 310 h30 M28 310 v-30">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M972 310 h-30 M972 310 v-30">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Titre -->
  <text x="500" y="110" text-anchor="middle" font-family="Orbitron, monospace"
        font-size="44" font-weight="700" fill="url(#txt)" filter="url(#glow)">
    GUNOUT
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Sous-titre -->
  <text x="500" y="145" text-anchor="middle" font-family="Orbitron, monospace"
        font-size="14" letter-spacing="6" fill="#00122E" opacity="0.85">
    &#9670; LIGHT MODE &#9670;
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- ============================================================ -->
  <!-- PANNEAU GAUCHE : whoami — boucle "machine à écrire" 10s      -->
  <!-- ============================================================ -->
  <g transform="translate(120,190)">
    <rect x="0" y="0" width="360" height="120" rx="12" fill="#FFFFFF"
          stroke="#0055FF" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Ligne 1 : prompt whoami (visible de 0% à 85%, puis effacé) -->
    <text x="20" y="34" font-family="monospace" font-size="14" fill="#0055FF">
      &gt; whoami
      <animate attributeName="opacity"
               values="1;1;1;0"
               keyTimes="0;0.05;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Ligne 2 : Python / Automation -->
    <text x="20" y="58" font-family="monospace" font-size="13" fill="#00122E">
      Python &#183; Automation
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.10;0.18;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Ligne 3 : Web / Data / Veille -->
    <text x="20" y="80" font-family="monospace" font-size="13" fill="#00122E">
      Web &#183; Data &#183; Veille
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.18;0.26;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Ligne 4 : status ONLINE -->
    <text x="20" y="102" font-family="monospace" font-size="13" fill="#E30613">
      &#9656; status: ONLINE
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.26;0.34;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Curseur clignotant -->
    <text x="168" y="102" font-family="monospace" font-size="13" fill="#0055FF">
      _
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- PANNEAU DROIT : stats — boucle décalée 10s                    -->
  <!-- ============================================================ -->
  <g transform="translate(520,190)">
    <rect x="0" y="0" width="360" height="120" rx="12" fill="#FFFFFF"
          stroke="#E30613" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2s"
               begin="0.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Ligne 1 : prompt stats -->
    <text x="20" y="34" font-family="monospace" font-size="14" fill="#E30613">
      &gt; stats
      <animate attributeName="opacity"
               values="1;1;1;0"
               keyTimes="0;0.10;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Ligne 2 : 47 repos -->
    <text x="20" y="58" font-family="monospace" font-size="13" fill="#00122E">
      47 repos / October 2026
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.20;0.28;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Ligne 3 : rapid shipping -->
    <text x="20" y="80" font-family="monospace" font-size="13" fill="#00122E">
      Rapid shipping mode
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.28;0.36;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Ligne 4 : light speed -->
    <text x="20" y="102" font-family="monospace" font-size="13" fill="#0055FF">
      &#9656; light speed
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.36;0.44;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Curseur clignotant -->
    <text x="150" y="102" font-family="monospace" font-size="13" fill="#E30613">
      _
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- BARRE DE PROGRESSION — synchronisée avec les panneaux         -->
  <!-- ============================================================ -->
  <g transform="translate(120,330)">
    <rect x="0" y="0" width="760" height="8" rx="4" fill="#DCE6F5"/>
    <rect x="0" y="0" width="560" height="8" rx="4" fill="#0055FF" filter="url(#glow)">
      <animate attributeName="width"
               values="0;0;560;560;0"
               keyTimes="0;0.05;0.44;0.85;0.95"
               dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="560" y="0" width="100" height="8" rx="4" fill="#00122E" opacity="0.9"/>
    <rect x="660" y="0" width="100" height="8" rx="4" fill="#E30613" filter="url(#glow)"/>
  </g>

  <!-- Indicateurs bleu/blanc/rouge pulsants -->
  <g transform="translate(900,340)">
    <circle cx="0" cy="0" r="3" fill="#0055FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="0" r="3" fill="#00122E">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="0" r="3" fill="#E30613">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
