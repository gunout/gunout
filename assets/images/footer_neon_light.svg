<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#000814"/>
      <stop offset="100%" stop-color="#1A0008"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0055FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="130" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="130" rx="14" fill="url(#grid)"/>
  <rect x="2" y="2" width="996" height="126" rx="12" fill="none" stroke="url(#txt)" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="58" text-anchor="middle" font-family="Orbitron, monospace" font-size="24" font-weight="700" fill="url(#txt)" filter="url(#glow)">◆ END OF TRANSMISSION ◆</text>
  <text x="500" y="88" text-anchor="middle" font-family="monospace" font-size="13" fill="#FFFFFF" opacity="0.85">bleu · blanc · rouge — system offline</text>
  <g transform="translate(500,105)">
    <circle cx="-24" cy="0" r="3.5" fill="#0055FF" filter="url(#glow)"/>
    <circle cx="0"   cy="0" r="3.5" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="24"  cy="0" r="3.5" fill="#E30613" filter="url(#glow)"/>
  </g>
</svg>
