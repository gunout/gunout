<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="200" viewBox="0 0 1600 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap');
      .title { font-family: 'Orbitron', monospace; font-weight: 700; }
    </style>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0D001A"/>
      <stop offset="50%"  stop-color="#1A0026"/>
      <stop offset="100%" stop-color="#0D001A"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF2D95" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2D95" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="200" fill="url(#fg)"/>
  
  <line x1="0" y1="20" x2="1600" y2="20" stroke="url(#fl)" stroke-width="2" filter="url(#glow)"/>
  
  <path d="M0 160 Q400 120 800 160 T1600 160 V200 H0 Z" fill="#FF2D95" fill-opacity="0.08">
    <animate attributeName="d" values="M0 160 Q400 120 800 160 T1600 160 V200 H0 Z;M0 160 Q400 180 800 160 T1600 160 V200 H0 Z;M0 160 Q400 120 800 160 T1600 160 V200 H0 Z" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0 180 Q400 140 800 180 T1600 180 V200 H0 Z" fill="#FF69B4" fill-opacity="0.15">
    <animate attributeName="d" values="M0 180 Q400 140 800 180 T1600 180 V200 H0 Z;M0 180 Q400 200 800 180 T1600 180 V200 H0 Z;M0 180 Q400 140 800 180 T1600 180 V200 H0 Z" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <text x="800" y="100" text-anchor="middle" class="title" font-size="34" fill="#FF2D95" letter-spacing="6" filter="url(#glow)">
    gunout
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="800" y="135" text-anchor="middle" font-family="monospace" font-size="13" fill="#FFB6D9" letter-spacing="3">© 2026 — NEON ROSE EDITION</text>
</svg>
