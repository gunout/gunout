<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="100%" stop-color="#1A0008"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="256" rx="14" fill="none" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>
  <!-- grille matrix -->
  <g font-family="monospace" font-size="12" fill="#0055FF" opacity="0.25">
    <text x="20" y="30">01 10 11 00 01 10</text>
    <text x="20" y="50">10 01 00 11 10 01</text>
    <text x="20" y="70">11 00 01 10 00 11</text>
    <text x="20" y="90">00 11 10 01 11 00</text>
  </g>
  <!-- infos -->
  <text x="450" y="95" text-anchor="middle" font-family="Orbitron, monospace" font-size="34" font-weight="700" fill="#0055FF" filter="url(#glow)">@gunout</text>
  <text x="450" y="135" text-anchor="middle" font-family="monospace" font-size="16" fill="#FFFFFF">Python · Automation · Web · Data</text>
  <text x="450" y="170" text-anchor="middle" font-family="monospace" font-size="14" fill="#E30613">▸ status: ONLINE</text>
</svg>
