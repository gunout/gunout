<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20" preserveAspectRatio="none">
  <defs>
    <!-- Dégradé principal : blanc → rose/rouge néon → blanc -->
    <linearGradient id="glow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%"  stop-color="#FF4FA3"/>
      <stop offset="50%"  stop-color="#FF1F7A"/>
      <stop offset="70%"  stop-color="#FF4FA3"/>
      <stop offset="85%"  stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Halo doux autour de la ligne -->
    <filter id="glow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Halo plus large, très diffus -->
    <filter id="soft-glow" x="-20%" y="-500%" width="140%" height="1100%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <!-- Fond blanc (optionnel, pour forcer le fond clair) -->
  <rect width="900" height="20" fill="#FFFFFF"/>

  <!-- Halo diffus derrière -->
  <line x1="0" y1="10" x2="900" y2="10"
        stroke="url(#glow-grad)" stroke-width="6" stroke-linecap="round"
        opacity="0.45" filter="url(#soft-glow)"/>

  <!-- Ligne principale lumineuse -->
  <line x1="0" y1="10" x2="900" y2="10"
        stroke="url(#glow-grad)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Petit cœur lumineux au centre -->
  <circle cx="450" cy="10" r="3" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="450" cy="10" r="1.5" fill="#FF1F7A"/>
</svg>
