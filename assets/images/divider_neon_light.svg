<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0055FF" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#0055FF">
        <animate attributeName="offset" values="0.2;0.3;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="80%"  stop-color="#E30613">
        <animate attributeName="offset" values="0.8;0.7;0.8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E30613" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="16" fill="#FFFFFF"/>

  <line x1="0" y1="8" x2="900" y2="8" stroke="url(#g)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite" />
  </line>

  <g fill="#FFFFFF" filter="url(#glow)">
    <rect x="445" y="4" width="10" height="8" rx="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
